<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Copilot AIC Usage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --card: #ffffff;
    --accent: #0969da;
    --danger: #d1242f;
    --shadow: 0 1px 0 rgba(31, 35, 40, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-subtle: #161b22;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --card: #0d1117;
      --accent: #58a6ff;
      --danger: #f85149;
      --shadow: 0 0 transparent;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h2.group-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .toggle-group {
    display: inline-flex;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .toggle-group button {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 4px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .toggle-group button[aria-pressed="true"] {
    background: var(--card);
    color: var(--fg);
    border-color: var(--border);
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .group-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .card .label { font-size: 0.75rem; color: var(--muted); }
  .card .value { font-size: 1.4rem; font-weight: 600; margin-top: 4px; }
  .card .value.small { font-size: 0.95rem; }
  .card .error { font-size: 0.8rem; color: var(--danger); }
  .chart-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  #chart { min-width: 480px; height: 420px; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(27, 31, 36, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
    z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(140, 149, 159, 0.3);
    max-width: 640px;
    width: 100%;
    max-height: calc(100vh - 96px);
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  .modal-body { padding: 16px; overflow-y: auto; }
  .modal-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .modal-section-title { font-size: 0.85rem; font-weight: 600; margin: 16px 0 8px; }
  .model-breakdown-list { list-style: none; margin: 0; padding: 0; font-size: 0.9rem; }
  .model-breakdown-list li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .checkpoint-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .checkpoint-item .checkpoint-title { font-weight: 600; font-size: 0.9rem; }
  .checkpoint-item .checkpoint-field { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
  .checkpoint-item .checkpoint-field b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
  <h1>GitHub Copilot AIC 使用量</h1>

  <div class="controls">
    <div class="toggle-group" id="dim-toggle">
      <button data-value="model" aria-pressed="true">モデル別</button>
      <button data-value="session">セッション別</button>
    </div>
    <div class="toggle-group" id="gran-toggle">
      <button data-value="day" aria-pressed="true">日次</button>
      <button data-value="week">週次</button>
      <button data-value="month">月次</button>
    </div>
  </div>

  <div class="groups">
    <div class="group-box">
      <h2 class="group-title">ローカル計測</h2>
      <div class="cards">
        <div class="card">
          <div class="label">ローカル総 AIU</div>
          <div class="value" id="card-total">-</div>
        </div>
        <div class="card">
          <div class="label">記録件数</div>
          <div class="value" id="card-rows">-</div>
        </div>
        <div class="card">
          <div class="label">期間</div>
          <div class="value small" id="card-range">-</div>
        </div>
      </div>
    </div>
    <div class="group-box">
      <h2 class="group-title">今月の請求ベース</h2>
      <div class="cards">
        <div class="card">
          <div class="label">今月 AIC</div>
          <div class="value" id="card-monthly">-</div>
          <div class="error" id="card-monthly-error"></div>
        </div>
        <div class="card">
          <div class="label">経過日数</div>
          <div class="value small" id="card-monthly-days">-</div>
        </div>
        <div class="card">
          <div class="label">月末予測 AIC</div>
          <div class="value" id="card-monthly-projected">-</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="modal-backdrop" id="session-modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="session-modal-title">
      <div class="modal-header">
        <h2 id="session-modal-title">セッション詳細</h2>
        <button class="modal-close" id="session-modal-close" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body" id="session-modal-body"></div>
    </div>
  </div>

<script>
const state = { dimension: "model", granularity: "day" };
let chart;

const palette = [
  "#2563eb", "#e07a5f", "#3a86ff", "#ffb703", "#8ecae6",
  "#c1121f", "#588157", "#9d4edd", "#f4a261", "#219ebc",
];

function bindToggle(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-value]");
    if (!btn) return;
    state[key] = btn.dataset.value;
    for (const b of el.querySelectorAll("button")) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
    loadUsage();
  });
}
bindToggle("dim-toggle", "dimension");
bindToggle("gran-toggle", "granularity");

async function loadUsage() {
  const params = new URLSearchParams({ dimension: state.dimension, granularity: state.granularity });
  const res = await fetch("/api/usage?" + params);
  const data = await res.json();
  if (!res.ok) {
    console.error("usage fetch failed", data);
    return;
  }
  renderChart(data);
  renderSummary(data);
}

function renderSummary(data) {
  document.getElementById("card-total").textContent = data.totalAIU.toFixed(3);
  document.getElementById("card-rows").textContent = data.rows;
  const range = data.firstAt && data.lastAt
    ? `${data.firstAt.slice(0, 10)} 〜 ${data.lastAt.slice(0, 10)}`
    : "-";
  document.getElementById("card-range").textContent = range;
}

function renderChart(data) {
  const isSession = data.dimension === "session";
  const datasets = data.series.map((s, i) => ({
    label: s.label || s.key,
    sessionId: isSession && s.key !== "unknown" ? s.key : null,
    data: s.values,
    backgroundColor: palette[i % palette.length],
  }));

  const cfg = {
    type: "bar",
    data: { labels: data.buckets, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true },
        y: { stacked: true, title: { display: true, text: "AIU" } },
      },
      plugins: {
        legend: { position: "bottom" },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)} AIU`,
          },
        },
      },
      onHover: (event, elements) => {
        const hit = elements[0] && chart.data.datasets[elements[0].datasetIndex];
        event.native.target.style.cursor = hit && hit.sessionId ? "pointer" : "default";
      },
      onClick: (event, elements) => {
        const el = elements[0];
        if (!el) return;
        const dataset = chart.data.datasets[el.datasetIndex];
        if (dataset.sessionId) openSessionDetail(dataset.sessionId);
      },
    },
  };

  if (chart) {
    chart.data = cfg.data;
    chart.options.onHover = cfg.options.onHover;
    chart.options.onClick = cfg.options.onClick;
    chart.update();
  } else {
    chart = new Chart(document.getElementById("chart"), cfg);
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = String(s);
  return div.innerHTML;
}

const sessionModalBackdrop = document.getElementById("session-modal-backdrop");
document.getElementById("session-modal-close").addEventListener("click", closeSessionModal);
sessionModalBackdrop.addEventListener("click", (e) => {
  if (e.target === sessionModalBackdrop) closeSessionModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSessionModal();
});

function closeSessionModal() {
  sessionModalBackdrop.hidden = true;
}

async function openSessionDetail(sessionId) {
  const body = document.getElementById("session-modal-body");
  document.getElementById("session-modal-title").textContent = "セッション詳細";
  body.textContent = "読み込み中……";
  sessionModalBackdrop.hidden = false;

  let res, data;
  try {
    res = await fetch("/api/session?id=" + encodeURIComponent(sessionId));
    data = await res.json();
  } catch (e) {
    body.textContent = "取得に失敗しました";
    return;
  }
  if (!res.ok) {
    body.textContent = data.error || "取得に失敗しました";
    return;
  }
  renderSessionDetail(data);
}

function renderSessionDetail(d) {
  document.getElementById("session-modal-title").textContent = d.summary || d.id;

  const metaParts = [];
  if (d.repository) metaParts.push(d.branch ? `${d.repository} (${d.branch})` : d.repository);
  if (d.cwd) metaParts.push(d.cwd);
  if (d.createdAt) metaParts.push(`作成: ${d.createdAt.slice(0, 16).replace("T", " ")}`);
  if (d.updatedAt) metaParts.push(`更新: ${d.updatedAt.slice(0, 16).replace("T", " ")}`);

  const modelList = (d.byModel || []).map((m) =>
    `<li><span>${escapeHtml(m.model)}</span><span>${m.aiu.toFixed(3)} AIU (${m.rows}件)</span></li>`
  ).join("");

  const checkpoints = (d.checkpoints || []).map((cp) => `
    <div class="checkpoint-item">
      <div class="checkpoint-title">#${cp.number} ${escapeHtml(cp.title || "(無題)")}</div>
      ${cp.overview ? `<div class="checkpoint-field"><b>概要:</b> ${escapeHtml(cp.overview)}</div>` : ""}
      ${cp.workDone ? `<div class="checkpoint-field"><b>作業内容:</b> ${escapeHtml(cp.workDone)}</div>` : ""}
      ${cp.nextSteps ? `<div class="checkpoint-field"><b>次のステップ:</b> ${escapeHtml(cp.nextSteps)}</div>` : ""}
    </div>
  `).join("");

  document.getElementById("session-modal-body").innerHTML = `
    <div class="modal-meta">${metaParts.map(escapeHtml).join(" ・ ")}</div>
    <div class="modal-section-title">モデル別内訳</div>
    <ul class="model-breakdown-list">${modelList || "<li>データがありません</li>"}</ul>
    <div class="modal-section-title">チェックポイント</div>
    ${checkpoints || "<div>チェックポイントの記録はありません</div>"}
  `;
}

function resetMonthlyPace() {
  document.getElementById("card-monthly-days").textContent = "-";
  document.getElementById("card-monthly-projected").textContent = "-";
}

async function loadMonthly() {
  const res = await fetch("/api/monthly");
  const data = await res.json();
  const valueEl = document.getElementById("card-monthly");
  const errEl = document.getElementById("card-monthly-error");
  if (!res.ok) {
    valueEl.textContent = "-";
    errEl.textContent = data.error || "取得に失敗しました";
    resetMonthlyPace();
    return;
  }
  errEl.textContent = "";
  valueEl.textContent = data.totalAIC.toFixed(2);

  const daysInMonth = new Date(data.year, data.month, 0).getDate();
  const now = new Date();
  const isCurrentMonth = now.getFullYear() === data.year && (now.getMonth() + 1) === data.month;
  const daysElapsed = isCurrentMonth ? now.getDate() : daysInMonth;
  const projected = daysElapsed > 0 ? (data.totalAIC / daysElapsed) * daysInMonth : data.totalAIC;

  document.getElementById("card-monthly-days").textContent = `${daysElapsed}/${daysInMonth} 日`;
  document.getElementById("card-monthly-projected").textContent = projected.toFixed(2);
}

loadUsage();
loadMonthly();
</script>
</body>
</html>
